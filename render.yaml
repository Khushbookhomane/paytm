services:
  - type: web
    name: paytm-ventureai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PROJECT_NAME
        value: Paytm VentureAI
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paytm-ventureai-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MERCHANT_TIMEZONE
        value: Asia/Kolkata
      - key: RP_ID
        sync: false
      - key: RP_NAME
        value: Paytm VentureAI
      - key: RP_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@ventureai.in
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: sandbox
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: ACCOUNT_AGGREGATOR_PROVIDER
        value: setu
      - key: AA_CLIENT_ID
        sync: false
      - key: AA_CLIENT_SECRET
        sync: false
      - key: AA_ENVIRONMENT
        value: sandbox
      - key: AA_WEBHOOK_SECRET
        sync: false
      - key: PAYTM_API_BASE_URL
        value: https://securegw-stage.paytm.in
      - key: PAYTM_CLIENT_ID
        sync: false
      - key: PAYTM_CLIENT_SECRET
        sync: false
      - key: PAYTM_MERCHANT_ID
        sync: false
      - key: PAYTM_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-3-5-sonnet-20241022

databases:
  - name: paytm-ventureai-db
    databaseName: ventureai
    plan: free
